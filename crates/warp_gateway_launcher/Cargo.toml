[package]
name = "warp_gateway_launcher"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Desktop UI launcher for the Managed Provider Gateway"
publish = false

[lib]
name = "warp_gateway_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "warp-gateway-launcher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
warp_gateway_wrapper = { path = "../warp_gateway_wrapper" }

tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }

tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }

directories = "6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
