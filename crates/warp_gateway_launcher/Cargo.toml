[package]
name = "warp_gateway_launcher"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Desktop UI launcher for the Managed Provider Gateway"
publish = false

[[bin]]
name = "warp-gateway-launcher"
path = "src/main.rs"

[dependencies]
warp_gateway_wrapper = { path = "../warp_gateway_wrapper" }

# UI: eframe with the default glow (OpenGL) backend — lighter + portable on Windows.
eframe = "0.29"
egui = "0.29"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }

# Logging
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }

arboard = "3.6"
directories = "6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
